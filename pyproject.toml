[project]
name = "sais-ocr"
version = "0.1.0"
description = "Ancient character detection training utilities for the SAIS OCR competition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "libtorrent>=2.0.11",
    "opencv-python-headless>=4.12.0.88",
    "scikit-learn>=1.8.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "tqdm>=4.67.3",
    "ultralytics>=8.3.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
