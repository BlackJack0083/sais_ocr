Global:
  use_gpu: true
  epoch_num: 30
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: /mnt/data/hejiakai/sais_ocr/runs/paddleocr_rec_repsvtr
  save_epoch_step: 1
  eval_batch_step: [0, 500]
  cal_metric_during_train: true
  pretrained_model:
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img: /mnt/data/hejiakai/sais_ocr/data/processed/competition_char_cls_crops/crops/val
  character_dict_path: /mnt/data/hejiakai/sais_ocr/data/processed/paddleocr_rec_group_hust035_chron_tail20/ppocr_keys_v1.txt
  character_type: ch
  max_text_length: 1
  infer_mode: false
  use_space_char: false
  save_res_path: /mnt/data/hejiakai/sais_ocr/runs/paddleocr_rec_repsvtr/predicts.txt

Optimizer:
  name: AdamW
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-8
  weight_decay: 0.05
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 2

Architecture:
  model_type: rec
  algorithm: SVTR
  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
    last_conv_stride: [1, 2]
    last_pool_type: avg
  Neck:
    name: SequenceEncoder
    encoder_type: svtr
    dims: 64
    depth: 2
    hidden_dims: 120
    use_guide: true
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /mnt/data/hejiakai/sais_ocr/data/processed/paddleocr_rec_group_hust035_chron_tail20
    label_file_list:
      - /mnt/data/hejiakai/sais_ocr/data/processed/paddleocr_rec_group_hust035_chron_tail20/rec_gt_train.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: true
    batch_size_per_card: 128
    drop_last: true
    num_workers: 4
    use_shared_memory: false

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /mnt/data/hejiakai/sais_ocr/data/processed/paddleocr_rec_group_hust035_chron_tail20
    label_file_list:
      - /mnt/data/hejiakai/sais_ocr/data/processed/paddleocr_rec_group_hust035_chron_tail20/rec_gt_val.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 2
    use_shared_memory: false
