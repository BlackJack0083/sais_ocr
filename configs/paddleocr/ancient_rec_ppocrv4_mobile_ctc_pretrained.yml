Global:
  model_name: ancient_rec_ppocrv4_mobile_ctc
  debug: false
  use_gpu: true
  epoch_num: 30
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: /mnt/data/hejiakai/sais_ocr/runs/paddleocr_rec_ppocrv4_mobile_ctc_pretrained
  save_epoch_step: 1
  eval_batch_step: [0, 500]
  cal_metric_during_train: true
  pretrained_model: /mnt/data/hejiakai/sais_ocr/pretrained/paddleocr/PP-OCRv4_mobile_rec_pretrained
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img: /mnt/data/hejiakai/sais_ocr/data/processed/competition_char_cls_crops/crops/val
  character_dict_path: /mnt/data/hejiakai/sais_ocr/data/processed/paddleocr_rec_group_hust035_chron_tail20/ppocr_keys_v1.txt
  max_text_length: 1
  infer_mode: false
  use_space_char: false
  distributed: false
  save_res_path: /mnt/data/hejiakai/sais_ocr/runs/paddleocr_rec_ppocrv4_mobile_ctc_pretrained/predicts.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0002
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Neck:
    name: SequenceEncoder
    encoder_type: svtr
    dims: 120
    depth: 2
    hidden_dims: 120
    kernel_size: [1, 3]
    use_guide: true
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /mnt/data/hejiakai/sais_ocr/data/processed/paddleocr_rec_group_hust035_chron_tail20
    label_file_list:
      - /mnt/data/hejiakai/sais_ocr/data/processed/paddleocr_rec_group_hust035_chron_tail20/rec_gt_train.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys:
            - image
            - label
            - length
  loader:
    shuffle: true
    batch_size_per_card: 128
    drop_last: true
    num_workers: 4
    use_shared_memory: false

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /mnt/data/hejiakai/sais_ocr/data/processed/paddleocr_rec_group_hust035_chron_tail20
    label_file_list:
      - /mnt/data/hejiakai/sais_ocr/data/processed/paddleocr_rec_group_hust035_chron_tail20/rec_gt_val.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys:
            - image
            - label
            - length
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 2
    use_shared_memory: false
